name: Compilation Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compiler l'APK (et vérifier la version PC)
        id: build
        continue-on-error: true
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :composeApp:assembleRelease :composeApp:compileKotlinDesktop --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Activer KVM pour l'émulateur
        if: steps.build.outcome == 'success'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Captures d'écran sur émulateur
        if: steps.build.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash .github/screenshots.sh

      - name: Publier l'APK sur la branche builds
        if: always()
        run: |
          VERSION=$(grep 'costoVersionName =' composeApp/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          APK=composeApp/build/outputs/apk/release/composeApp-release.apk
          mkdir -p out
          cp build.log out/ 2>/dev/null || true
          if [ -f "$APK" ]; then
            cp "$APK" "out/costo-$VERSION.apk"
            echo "ok $VERSION $GITHUB_SHA" > out/status.txt
          else
            echo "echec $GITHUB_SHA" > out/status.txt
          fi
          cp -r shots out/ 2>/dev/null || true
          cd out
          git init -q -b builds
          git add -A
          git -c user.name="Costo CI" -c user.email="ci@costo.local" commit -qm "Build $GITHUB_SHA"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" builds
